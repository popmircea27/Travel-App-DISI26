version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: travellapp-postgres
    restart: always
    environment:
      POSTGRES_DB: travellApp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
