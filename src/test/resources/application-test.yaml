spring:
  application:
    name: TravelAppBE

  datasource:
    url: jdbc:h2:mem:test
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 10
        order_inserts: true
        order_updates: true
        use_sql_comments: true
        dialect_storage_engine: null

  flyway:
    enabled: false
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    com.example.travelappbe: DEBUG
