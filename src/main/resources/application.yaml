spring:
  application:
    name: TravelAppBE

  datasource:
    url: jdbc:postgresql://localhost:5432/travellApp
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: your-secret-key-must-be-at-least-256-bits-long-for-HS256-algorithm-requirement-please-change-in-production
  expiration: 86400000

server:
  port: 8080