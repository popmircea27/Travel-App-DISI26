services:
  ollama:
    image: ollama/ollama:latest
    container_name: travellapp-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  ollama-init:
    image: ollama/ollama:latest
    container_name: travellapp-ollama-init
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: >
      /bin/sh -c "
      sleep 10 &&
      ollama pull llama3.1
      "
    restart: "no"

  ai-itinerary-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travellapp-ai-itinerary
    restart: always
    depends_on:
      - ollama
      - ollama-init
    environment:
      BACKEND_URL: http://host.docker.internal:8080
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.1
    ports:
      - "8000:8000"

volumes:
  ollama_data: